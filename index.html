<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b84ff"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>AutoRepair</title></head><body><header><b>AutoRepair</b><small>Технически помощник</small></header><main>
<section id="home" class="screen active"><div class="hero"><small>МОЯТ АВТОМОБИЛ</small><h1 id="selectedCar">Не е избран</h1><p id="selectedEngine">Избери автомобил, за да започнеш.</p><button onclick="show('cars')">Избери автомобил</button></div><div class="grid"><button onclick="show('specs')">🔧<br>Технически данни</button><button onclick="show('diagnostics')">🔍<br>OBD диагностика</button><button onclick="show('repairs')">🛠️<br>Ремонти</button><button onclick="show('search')">⌕<br>Търсене</button></div></section>
<section id="cars" class="screen"><h2>Автомобил</h2><label>Марка<select id="makeSelect"></select></label><label>Модел<select id="modelSelect"></select></label><label>Година<select id="yearSelect"></select></label><label>Двигател<select id="engineSelect"></select></label><button onclick="saveVehicle()">Запази</button></section>
<section id="specs" class="screen"><h2>Технически данни</h2><div id="vehicleSummary"></div><div id="specList"></div><aside>Сервизни стойности като количества, моменти и допуски ще се добавят само от проверени/лицензирани източници.</aside></section>
<section id="diagnostics" class="screen"><h2>OBD диагностика</h2><input id="obdSearch" placeholder="Код, напр. P0301" oninput="renderOBD()"><div id="obdList"></div></section>
<section id="obdDetail" class="screen"><button class="back" onclick="show('diagnostics')">‹ Назад</button><div id="obdDetailBody"></div></section>
<section id="repairs" class="screen"><h2>Ремонтна история</h2><div id="repairList"></div><button onclick="addRepair()">＋ Добави ремонт</button></section>
<section id="search" class="screen"><h2>Търсене</h2><input id="globalSearch" placeholder="Автомобил, код или система" oninput="globalSearch()"><div id="searchResults"></div></section></main>
<nav><button onclick="show('home')">⌂<small>Начало</small></button><button onclick="show('cars')">🚗<small>Автомобил</small></button><button onclick="show('specs')">🔧<small>Техника</small></button><button onclick="show('diagnostics')">🔍<small>OBD</small></button></nav><script src="app.js"></script></body></html>
