<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b84ff"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>AutoRepair</title></head><body><header><b>AutoRepair</b><span>Технически помощник</span></header><main><section id="home" class="page active"><div class="hero"><small>МОЯТ АВТОМОБИЛ</small><h1 id="car">Не е избран автомобил</h1><p id="eng">Избери автомобил, за да започнеш.</p><button onclick="show('cars')">Избери автомобил</button></div><div class="grid"><button onclick="show('specs')">🔧<br>Технически данни</button><button onclick="show('obd')">🔍<br>OBD диагностика</button><button onclick="show('repairs')">🛠️<br>Ремонти</button><button onclick="show('search')">⌕<br>Търсене</button></div></section><section id="cars" class="page"><h2>Автомобил</h2><label>Марка<select id="make"></select></label><label>Модел<select id="model"></select></label><label>Двигател<select id="engine"></select></label><button onclick="save()">Запази</button></section><section id="specs" class="page"><h2>Технически данни</h2><div id="specList"></div><p class="notice">Демо стойности. Реалните сервизни спецификации ще се добавят само от проверени/лицензирани източници.</p></section><section id="obd" class="page"><h2>OBD диагностика</h2><input id="obdq" placeholder="Напр. P0301" oninput="renderOBD()"><div id="obdList"></div></section><section id="repairs" class="page"><h2>Ремонти</h2><div id="repairList"></div><button onclick="addRepair()">＋ Добави запис</button></section><section id="search" class="page"><h2>Търсене</h2><input id="q" placeholder="Код или тема" oninput="searchAll()"><div id="results"></div></section></main><nav><button onclick="show('home')">⌂<small>Начало</small></button><button onclick="show('cars')">🚗<small>Автомобил</small></button><button onclick="show('specs')">🔧<small>Техника</small></button><button onclick="show('obd')">🔍<small>OBD</small></button></nav><script src="app.js"></script></body></html>
